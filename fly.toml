app = 'plausible-mcp'
primary_region = 'fra'

# BASE_URL and ALLOWED_DOMAINS are deliberately not here: they differ per
# deployment, and a placeholder in this file would overwrite the real value on
# the next deploy. Set them with `fly secrets set` alongside the others.
[env]
  PORT = '8080'
  CLIENT_STORAGE_PATH = '/data/oauth-clients'
  USAGE_PATH = '/data/usage'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[mounts]
  source = 'plausible_mcp_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
